; Configuration PHP pour la production
; Ce fichier est lu par PHP-FPM sur les hébergements mutualisés (ex. Infomaniak)

; Ne jamais afficher les erreurs aux visiteurs
display_errors = Off
display_startup_errors = Off

; Journaliser les erreurs côté serveur (dans var/log/)
log_errors = On

; Niveau de rapport : tout sauf les dépréciations en production
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
