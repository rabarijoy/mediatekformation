name: Deploy to production (FTP)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & deploy Symfony app
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Récupération du code source
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis par FTP-Deploy-Action

      # ------------------------------------------------------------------
      # 2. Installation de PHP
      # ------------------------------------------------------------------
      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: ctype, iconv, intl, pdo_mysql
          coverage: none

      # ------------------------------------------------------------------
      # 3. Cache des dépendances Composer
      # ------------------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ------------------------------------------------------------------
      # 4. Installation des dépendances PHP (mode production)
      # ------------------------------------------------------------------
      - name: Install Composer dependencies (production)
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      # ------------------------------------------------------------------
      # 5. Détecter si composer.lock a changé dans ce push
      # ------------------------------------------------------------------
      - name: Check if composer.lock changed
        id: composer_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^composer\.lock$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "composer.lock has changed — vendor/ will be deployed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "composer.lock unchanged — skipping vendor/ deployment"
          fi

      # ------------------------------------------------------------------
      # 6. Déploiement via lftp (FTPS explicite — compatible Infomaniak)
      # ------------------------------------------------------------------
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy app files via lftp (sans vendor/)
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob vendor/ \
            --exclude-glob var/cache/ \
            --exclude-glob var/log/ \
            --exclude-glob tests/ \
            --exclude-glob node_modules/ \
            --exclude-glob backups/ \
            --exclude-glob Suivi/ \
            --exclude-glob .phpdoc/ \
            --exclude-glob nbproject/ \
            --exclude .env \
            --exclude .env.local \
            --exclude phpunit.xml.dist \
            --exclude phpDocumentor.phar \
            --exclude .phpunit.result.cache \
            . /
          bye
          EOF

      - name: Deploy vendor/ via lftp (uniquement si composer.lock a changé)
        if: steps.composer_changed.outputs.changed == 'true'
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            vendor/ /vendor/
          bye
          EOF
